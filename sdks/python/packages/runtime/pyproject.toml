[project]
name = "syntara-plugin-runtime"
version = "0.1.0a1"
description = "Minimal runtime interfaces for Syntara plugin contracts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.37",
  "grpcio>=1.78.0",
  "pydantic>=2.0",
  "protobuf>=6.31.1",
  "syntara-plugin-contracts==0.1.0a1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/syntara-orchestration/syntara-plugin-sdk"
Repository = "https://github.com/syntara-orchestration/syntara-plugin-sdk"
Issues = "https://github.com/syntara-orchestration/syntara-plugin-sdk/issues"

[tool.uv.sources]
syntara-plugin-contracts = { workspace = true }

[build-system]
# Keep release builds reproducible; upgrades are reviewed like any other
# build-tool supply-chain change.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_plugin"]
