{
  "apiVersion": "syntara.io/v1alpha1",
  "kind": "Plugin",
  "metadata": {
    "namespace": "example",
    "name": "existing-step",
    "version": "0.1.0",
    "displayName": "Existing Step",
    "description": "Reproducible Action, Control, and Trigger execution paths."
  },
  "spec": {
    "documentation": {
      "path": "docs/README.md"
    },
    "workload": {
      "image": "existing-step-workload"
    },
    "targets": [
      "steps/create-ticket.yaml",
      "steps/normalize-records.yaml",
      "steps/record-opened.yaml"
    ]
  }
}
