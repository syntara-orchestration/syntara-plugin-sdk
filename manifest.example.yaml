# Syntara Step SDK - Example Step Manifest
# This template shows the available fields following Kubernetes CRD conventions.
# Copy this template when creating new steps.

apiVersion: syntara.io/v1alpha1
kind: StepType

metadata:
  # Internal step identifier (snake_case) - used as primary key
  name: example_step

  # Human-readable name displayed in UI palette and canvas
  displayName: Example Step

  # Icon identifier for React Flow palette (see StepPaletteIcon in common-definitions.json)
  # Options: globe, database, script, webhook, loop, condition, git, cloud, mail, etc.
  icon: cube

  # Multi-line description (supports markdown)
  description: |
    Brief description of what this step does.
    Explain the primary use case and key capabilities.

  # Searchable tags for filtering in the step palette
  tags:
    - integration:rest-api
    - network:external

  # Optional author attribution
  authors:
    - name: Your Name or Organization
  license: Apache-2.0

  # Optional: Link to detailed documentation
  documentationUrl: https://docs.syntara.io/steps/example-step

spec:
  # Step category: action | task | workflow | trigger
  category: action

  # Sandbox, egress, and worker-pool policy are intentionally omitted here.
  # Administrators provide those controls in POST /api/v1/step-types.

  # Runtime environment. This is the image the execution plane runs the step
  # IN -- not the step's OCI distribution artifact. Manifests do not declare
  # where a step runs; the Execution Plane determines placement from category,
  # resource requirements, and administrative policy.
  execution:
    # The runtime environment: an interpreter plus the SDK, named for what it
    # provides. It holds no step code -- the implementations live in the plugin
    # artifact. Usually a generic runner reused across steps and plugins; a
    # step with unusual dependencies may warrant its own. Null if none needed.
    image: quay.io/syntara/python-executor:1.0.0

    # Step handle, "module.path:ClassName", resolving to this step's BaseStep
    # subclass inside the plugin artifact. A plugin can package several steps,
    # so the runtime uses this to load the right one. Not a shell command --
    # a subprocess would bypass the base class's validation and redaction.
    entrypoint: main:ExampleStep

  # Developer-declared extension requirements. These describe the capabilities
  # the extension needs and are inspected by administrators before execution.
  # Syntara binds them to infrastructure policy at registration time through
  # sandbox_required, egress_policy, and worker_pool_selector.

  declaredRequirements:
    capabilities:
      - network-egress           # Can make outbound HTTP requests
      - readonly-root-filesystem # Runs with read-only root FS
      # Other options: script-execution, tmpfs-mount, privileged-execution

    # Minimum platform version
    platformVersion: ">=3.0.0"

  # Developer-declared scheduling and connectivity requirements
  schedulingControls:
    # Network connectivity requirements for administrative review and
    # execution-plane policy matching
    connectivity_requirements:
      - host: api.example.com
        ports:
          - port: 443
            protocol: TCP

    # Affinity labels for developer-declared placement requirements
    # Registration policy is supplied separately through worker_pool_selector.
    affinity_labels:
      - workload_type=integration
      - region=us-east-1

  # Input schema (JSON Schema Draft-07)
  inputs:
    type: object
    properties:
      # Example: Simple string input
      url:
        type: string
        description: Target URL
        minLength: 10
        maxLength: 2048
        examples:
          - https://api.example.com/v1/resource

      # Non-credential sensitive data (PII, business-sensitive fields) is
      # flagged with redact: true. The value is supplied as a normal input; the
      # platform keeps it out of outputs, logs, errors, and persisted state.
      # Authentication credentials must NOT be declared here -- use
      # spec.credentialSpecification.credential_references instead.
      customer_email:
        type: string
        description: Customer email address used to look up the record
        redact: true

      # Example: Enum with default
      method:
        type: string
        description: HTTP method
        enum: [GET, POST, PUT, DELETE, PATCH]
        default: GET

      # Example: Dynamic dictionary (patternProperties)
      headers:
        type: object
        description: HTTP headers
        patternProperties:
          "^[A-Za-z0-9-]+$":
            type: string
        default: {}

      # Example: oneOf union for polymorphic types
      body:
        description: Request body (JSON object or raw string)
        oneOf:
          - type: object
            description: JSON object body
          - type: string
            description: Raw string body

      # Example: Array of specific type
      tags:
        type: array
        description: Resource tags
        items:
          type: string
        default: []

      # Example: Credential reference (zero-trust UUID only)
    required:
      - url

  # Output schema - must reference StandardOutputWrapper
  outputs:
    allOf:
      - $ref: "schemas/common-definitions.json#/definitions/StandardOutputWrapper"

  # Resource limits for container execution (Kubernetes format)
  resourceRequirements:
    limits:
      cpu: 500m      # 0.5 CPU cores
      memory: 256Mi  # 256 megabytes
    requests:
      cpu: 100m      # 0.1 CPU cores
      memory: 128Mi  # 128 megabytes

  # Execution timeout in seconds (default: 300)
  executionTimeout: 60

  # Authentication credentials. Declare NAMED REQUIREMENTS describing what the step
  # needs -- never a credential UUID or value. A step type is published before
  # any credential exists and is installed into many instances, so it cannot
  # know an ID. The workflow author binds a real credential to each entry when
  # configuring the step, and that binding lives in the workflow definition.
  credentialSpecification:
    credential_requirements:
      - name: api_auth
        description: Token used to authenticate outbound requests
        types: [API Key, Bearer Token]
        required: true
        mount_type: header
        header_name: Authorization
