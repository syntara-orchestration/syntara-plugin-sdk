name: CI

on:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups # NOSONAR: installs local editable workspace packages.
      - run: uv run --no-sync --no-build pytest sdks/python/tests examples -q

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups # NOSONAR: installs local editable workspace packages.
      - run: uv run --no-sync --no-build pre-commit run --all-files

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups # NOSONAR: installs local editable workspace packages.
      - run: uv build --all-packages --out-dir dist
      - run: uv run --no-sync twine check --strict dist/*
      - name: Smoke-test the published dependency metadata
        run: |
          sdk_version="$(uv run --no-sync python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("sdks/python/packages/sdk/pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          uv venv --clear .venv-release
          uv pip install --python .venv-release/bin/python --find-links dist \
            "syntara-plugin-sdk==$sdk_version"
          .venv-release/bin/syntara-plugin --help
          .venv-release/bin/python - <<'PY'
          from syntara_plugin.contracts import load_bundle
          from syntara_plugin.runtime import ContainerInvocation
          from syntara_plugin.sdk import compile_workspace

          assert load_bundle().digest
          assert ContainerInvocation
          assert compile_workspace
          PY
