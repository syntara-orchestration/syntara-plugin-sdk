{
  "apiVersion": "syntara.io/v1alpha1",
  "kind": "Action",
  "metadata": {
    "name": "http-request",
    "displayName": "HTTP Request (compat)",
    "description": "Makes a loopback HTTP request authorized by the delivered credential."
  },
  "spec": {
    "runtime": {
      "kind": "custom-runner",
      "entryPoint": "credential_steps.runtime:HttpRequestStep"
    },
    "integrationType": "compat.credentials.connection",
    "input": {
      "kind": "inline",
      "value": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "additionalProperties": false,
        "required": ["url"],
        "properties": {
          "url": {
            "type": "string",
            "pattern": "^http://127\\.0\\.0\\.1:18080(/.*)?$",
            "description": "Loopback URL on the step's fixed verification port; the fixture workload never leaves the pod."
          },
          "method": {
            "type": "string",
            "enum": ["GET", "POST"],
            "default": "GET",
            "description": "HTTP method for the request."
          },
          "timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 60,
            "default": 15,
            "description": "Request timeout."
          }
        }
      }
    },
    "output": {
      "kind": "inline",
      "value": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "additionalProperties": false,
        "required": ["status_code", "body", "headers", "elapsed"],
        "properties": {
          "status_code": {"type": "integer", "description": "HTTP response status code."},
          "body": {"description": "Parsed JSON response body, or raw text if not JSON."},
          "headers": {
            "type": "object",
            "additionalProperties": {"type": "string"},
            "description": "HTTP response headers."
          },
          "elapsed": {"type": "number", "description": "Request duration in seconds."}
        }
      }
    }
  }
}
