[project]
name = "syntara-plugin-runtime"
version = "0.1.0"
description = "Minimal runtime interfaces for Syntara plugin contracts"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "grpcio>=1.78.0",
  "pydantic>=2.0",
  "protobuf>=6.31.1",
  "syntara-plugin-contracts>=0.1.0",
]

[tool.uv.sources]
syntara-plugin-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_plugin"]
