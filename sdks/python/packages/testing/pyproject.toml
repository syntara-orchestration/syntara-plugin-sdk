[project]
name = "syntara-plugin-testing"
version = "0.1.0"
description = "Local pytest harness and fixtures for Syntara plugin step authors"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0",
  "syntara-plugin-contracts>=0.1.0",
  "syntara-plugin-runtime>=0.1.0",
  "syntara-plugin-sdk>=0.1.0",
]

[project.entry-points.pytest11]
syntara_plugin_testing = "syntara_plugin.testing.plugin"

[tool.uv.sources]
syntara-plugin-contracts = { workspace = true }
syntara-plugin-runtime = { workspace = true }
syntara-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syntara_plugin"]
