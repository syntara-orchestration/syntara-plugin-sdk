name: CI

on:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups # NOSONAR: installs local editable workspace packages.
      - run: uv run --no-sync --no-build pytest sdks/python/tests examples -q

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups # NOSONAR: installs local editable workspace packages.
      - run: uv run --no-sync --no-build pre-commit run --all-files
