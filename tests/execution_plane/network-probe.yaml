apiVersion: v1
kind: Pod
metadata:
  name: compat-network-probe
spec:
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      command: ["sleep", "1800"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 250m
          memory: 128Mi
          ephemeral-storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: compat-network-peer
spec:
  automountServiceAccountToken: false
  containers:
    - name: peer
      image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 250m
          memory: 128Mi
          ephemeral-storage: 64Mi
