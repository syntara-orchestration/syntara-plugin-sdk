syntax = "proto3";

package syntara.container.v1alpha2;

// ABI means Application Binary Interface. Here it is the versioned, language-
// neutral gRPC protocol between the Execution Plane (the client/launcher) and
// a publisher-owned plugin workload (the server), not an OCI image's CPU or
// operating-system compatibility. A workload in any language may participate
// if it implements this service and the message semantics below.
//
// Health checks the ABI and step revision before Execute. Version v1alpha2
// extends the bidirectional v1alpha1 protocol with structured partial-result
// progress data and is incompatible with v1alpha1 peers. Both peers must
// implement this contract. The transport must authenticate both peers and
// protect confidentiality (mTLS in production).
service ContainerService {
  rpc Execute(stream ExecuteClientMessage) returns (stream ExecuteServerMessage);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  // Host-assigned identity of this invocation, used to correlate events,
  // credential requests, and cancellation. EP supplies its dispatch-attempt ID;
  // this is not a project, workflow, or workflow-execution identifier.
  string invocation_id = 1;
  // Handler identifier advertised by this workload's Health response. Selects
  // the implementation to execute; does not identify an individual invocation.
  string step_revision_id = 2;
  // Version of the container protocol understood by both host and workload.
  string runtime_abi = 3;
  // UTF-8 JSON object containing business inputs for the selected handler.
  bytes inputs_json = 4;
  reserved 5;
  reserved "credential_file_paths_json";
  // Execution budget, excluding terminal-event delivery. The runtime signals
  // cancellation and reports TIMEOUT/not_completed when this budget expires.
  // This does not prove arbitrary handler code has stopped. Clients should
  // allow a bounded delivery window beyond this budget in their RPC deadline.
  uint32 timeout_seconds = 6;
  // Optional UTF-8 JSON object supplied by the caller and exposed to plugin
  // code as ExecutionContext.runtime_context. Omitted/empty bytes mean {}.
  // Keys are caller-defined. Do not include credentials or other secrets.
  bytes runtime_context_json = 7;
}

// The first client message is start; subsequent messages are responses to
// credential requests. Each request ID is unique within an invocation. A
// client may close its send stream; the invocation continues, but pending and
// future credential reads fail. Any other subsequent message processed before
// the terminal event is committed cancels the invocation with a terminal
// CANCELLED failure. Messages arriving after that point may be ignored.
message ExecuteClientMessage {
  oneof message {
    ExecuteRequest start = 1;
    CredentialResponse credential_response = 2;
  }
}

message ExecuteServerMessage {
  oneof message {
    ExecutionEvent event = 1;
    CredentialRequest credential_request = 2;
    LogBatch log_batch = 3;
  }
}

// Version 1 operational logs. A batch is sent at most once, immediately
// before a terminal event. It is a one-way notification; no reply is required.
// The batch holds at most 128 events and 262144 serialized protobuf bytes.
// Excess or invalid events are dropped without failing the invocation.
message LogBatch {
  string invocation_id = 1;
  uint32 version = 2; // Must be 1.
  repeated LogEvent events = 3;
  uint32 dropped_count = 4; // Saturating count of rejected/overflow records.
}

// timestamp is UTC RFC 3339 with millisecond precision. severity is one of
// TRACE, DEBUG, INFO, WARN, ERROR, FATAL. message is 1..4096 UTF-8 bytes;
// event_name is empty or 1..128 ASCII characters from [A-Za-z0-9_.-].
// attributes_json is a JSON object at most 16384 UTF-8 bytes containing at
// most 32 top-level members and JSON values (finite numbers only), with at
// most 8 nested container levels, at most 2048 values, and signed 64-bit
// integers. It is never inspected for secrets.
message LogEvent {
  string timestamp = 1;
  string severity = 2;
  string message = 3;
  string event_name = 4;
  bytes attributes_json = 5;
}

// name is a declared CredentialRecipe ID, not a credential ID or reference.
message CredentialRequest {
  string invocation_id = 1;
  string request_id = 2;
  string name = 3;
}

// This sensitive response is never an ExecutionEvent. Exactly one of document
// or error must be set. The document is a JSON object of at most 1 MiB;
// error has no provider-specific message or details.
message CredentialResponse {
  string invocation_id = 1;
  string request_id = 2;
  oneof outcome {
    bytes document_json = 3;
    CredentialError error = 4;
  }
}

enum CredentialError {
  CREDENTIAL_ERROR_UNSPECIFIED = 0;
  CREDENTIAL_ERROR_MISSING = 1;
  CREDENTIAL_ERROR_UNAVAILABLE = 2;
}

message Progress {
  uint32 sequence = 1;
  string state = 2;
  string message = 3;
  double percent = 4;
  bool has_percent = 5;
  // Optional structured partial-result snapshot accompanying a progress event.
  PartialResult partial_result = 6;
}

message PartialResult {
  // True marks the last partial-result snapshot for this invocation.
  bool is_last = 1;
  // Canonical UTF-8 JSON object containing the snapshot data. Empty data
  // objects are valid, including for a final marker with no result to report.
  // The encoded object is at most 16384 bytes with at most 32 top-level members.
  bytes data_json = 2;
}

// The terminal SDK output envelope. A completed step with a nonzero
// status_code remains a valid SDK outcome; the separate Failure event is
// reserved for protocol or runtime failures where no valid outcome exists.
message Result {
  // Trusted digest of the step type's declared output schema. It is applied
  // to the successful business result below, never to this envelope itself.
  string output_schema_digest = 1;
  // Canonical JSON of the SDK wrapper's Result field (the business output).
  bytes output_json = 2;
  // Object-store reference to the serialized business result when it exceeds
  // the inline JSON bound. A successful result carries exactly one of
  // output_json/object_reference; a deliberate step type failure may omit both.
  string object_reference = 3;
  // The SDK wrapper's StatusCode: 0 is success and any nonzero value is a
  // deliberate step type failure that remains a valid terminal outcome.
  uint32 status_code = 4;
  // Safe, bounded wrapper StatusMessage.
  string status_message = 5;
  // Former flattened error fields must not be reused.
  reserved 6, 7, 8, 9;
  reserved "error_code", "error_message", "retryable", "error_category";
  // Canonical JSON of the complete structured ErrorResult; empty on success.
  bytes error_result_json = 10;
  // Canonical digest of the effective schema applied to the error result.
  string error_schema_digest = 11;
}

// Emitted only when no valid SDK outcome can be produced, for example an ABI
// violation or an unexpected runtime failure. A completed step with a nonzero
// StatusCode is carried by Result instead.
message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string outcome = 4;
  string correlation_id = 5;
  string provider_code = 6;
}

message ExecutionEvent {
  string invocation_id = 1;
  oneof event {
    Progress progress = 2;
    Result result = 3;
    Failure failure = 4;
  }
}

message CancelRequest { string invocation_id = 1; }
message CancelResponse { bool accepted = 1; }
message HealthRequest {}
// Runtime metadata observed inside one immutable workload image.
message RuntimeComponent {
  // Runtime component identifier from RuntimeBinding, for example "python".
  string name = 1;
  // Absolute executable path inside the image.
  string executable = 2;
  // Version reported by the in-image probe; empty when it is unsupported.
  string version = 3;
  // "matched" or "unsupported". This is workload-reported consistency data,
  // not evidence of image integrity or publisher identity.
  string probe_status = 4;
}
message HealthResponse {
  bool ready = 1;
  string runtime_abi = 2;
  repeated string step_revision_ids = 3;
  // Runtime metadata for image components declared by the SDK registration file.
  repeated RuntimeComponent runtime_components = 4;
}
