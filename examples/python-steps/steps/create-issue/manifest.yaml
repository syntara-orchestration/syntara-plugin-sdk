apiVersion: syntara.io/v1alpha1
kind: Action
metadata:
  name: create-issue
  displayName: Create issue
  description: Creates one issue in an external tracker.
spec:
  runtime:
    kind: custom-runner
    entryPoint: python_steps.create_issue:CreateIssueStep
  input:
    kind: inline
    value:
      type: object
      properties:
        title:
          type: string
          title: Summary
          minLength: 1
        description:
          type: string
          title: Description
          default: ""
        request_type:
          type: string
          title: Request type
          default: bug
          enum: [bug, feature]
        priority:
          type: string
          title: Priority
          default: low
          enum: [low, medium, high]
        estimate_points:
          type: integer
          title: Estimate points
          default: 3
          minimum: 1
          maximum: 21
        notify_watchers:
          type: boolean
          title: Notify watchers
          default: true
        due_date:
          type: [string, "null"]
          title: Due date
          format: date
        api_token:
          type: string
          title: API token
          default: ""
          description: Test-only value for the local example; not credential delivery.
      required: [title]
      allOf:
        - if:
            properties:
              request_type:
                const: bug
            required: [request_type]
          then:
            properties:
              reproduction_steps:
                type: string
                title: Reproduction steps
                minLength: 1
              environment:
                type: string
                title: Environment
                default: development
                enum: [development, staging, production]
            required: [reproduction_steps]
        - if:
            properties:
              request_type:
                const: feature
            required: [request_type]
          then:
            properties:
              business_value:
                type: string
                title: Business value
                minLength: 1
              target_release:
                type: [string, "null"]
                title: Target release
            required: [business_value]
  inputPresentation:
    renderer: rjsf.v1
    uiSchema:
      kind: asset
      path: ui/create-issue.yaml
  output:
    kind: inline
    value:
      type: object
      properties:
        issue_url:
          type: string
      required: [issue_url]
  error:
    kind: inline
    value:
      type: object
