syntax = "proto3";

package syntara.container.v1alpha1;

// The container ABI is the application-data channel between the Execution
// Plane and a plugin workload. It deliberately carries step identity and
// bounded JSON objects, never a container command or plaintext credential.
service ContainerService {
  rpc Execute(ExecuteRequest) returns (stream ExecutionEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  string invocation_id = 1;
  string workflow_run_id = 8;
  string step_revision_id = 2;
  string runtime_abi = 3;
  bytes inputs_json = 4;
  // A JSON object mapping approved credential names to temporary in-container
  // file paths. Secret values never travel through this protocol.
  bytes credential_file_paths_json = 5;
  uint32 timeout_seconds = 6;
  // A bounded, non-secret runner-specific context selected by Syntara from the
  // installed immutable step. It never contains an endpoint or credential.
  bytes runtime_context_json = 7;
}

message Progress {
  uint32 sequence = 1;
  string state = 2;
  string message = 3;
  double percent = 4;
  bool has_percent = 5;
}

// The terminal SDK output envelope. A completed step with a nonzero
// status_code remains a valid SDK outcome; the separate Failure event is
// reserved for protocol or runtime failures where no valid outcome exists.
message Result {
  // Trusted digest of the step type's declared output schema. It is applied
  // to the successful business result below, never to this envelope itself.
  string output_schema_digest = 1;
  // Canonical JSON of the SDK wrapper's Result field (the business output).
  bytes output_json = 2;
  // Object-store reference to the serialized business result when it exceeds
  // the inline JSON bound. A successful result carries exactly one of
  // output_json/object_reference; a deliberate step failure may omit both.
  string object_reference = 3;
  // The SDK wrapper's StatusCode: 0 is success and any nonzero value is a
  // deliberate step failure that remains a valid terminal outcome.
  uint32 status_code = 4;
  // Safe, bounded wrapper StatusMessage.
  string status_message = 5;
  // Named failure category for a deliberate step failure; empty on success.
  // Consumers must not invent numeric status subcodes.
  string error_code = 6;
  // Safe, bounded wrapper ErrorMessage; empty on success.
  string error_message = 7;
  // Whether a deliberate step failure may be retried.
  bool retryable = 8;
}

// Emitted only when no valid SDK outcome can be produced, for example an ABI
// violation or an unexpected runtime failure. A completed step with a nonzero
// StatusCode is carried by Result instead.
message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string outcome = 4;
  string correlation_id = 5;
  string provider_code = 6;
}

message ExecutionEvent {
  string invocation_id = 1;
  oneof event {
    Progress progress = 2;
    Result result = 3;
    Failure failure = 4;
  }
}

message CancelRequest { string invocation_id = 1; }
message CancelResponse { bool accepted = 1; }
message HealthRequest {}
message HealthResponse {
  bool ready = 1;
  string runtime_abi = 2;
  repeated string step_revision_ids = 3;
}
