name: Step types compatibility

on:
  workflow_call:
    inputs:
      step_types_ref:
        type: string
        required: false
        default: ""
      report_only:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  STEP_TYPES_REF: ${{ inputs.step_types_ref || '3991e986f92f4b1b00a76e21902038215915bd19' }}

jobs:
  step-types-compat:
    name: Step type compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: step-types-compat-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: sdk
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether the check applies
        id: changes
        working-directory: sdk
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run_compat=true" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant="$(git diff --no-renames --name-only HEAD^1 HEAD \
            | grep -Ev '^(docs/.*|.*\.md|LICENSE|\.github/CODEOWNERS|\.github/pull_request_template\.md)$' \
            || true)"
          if [ -n "$relevant" ]; then
            echo "run_compat=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_compat=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed; the step types check is skipped by design."
          fi
          echo "base_sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Validate the step-types ref
        if: steps.changes.outputs.run_compat == 'true'
        run: |
          if ! [[ "$STEP_TYPES_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]; then
            echo '::error title=Invalid step_types_ref::Use a commit SHA, branch, or tag name.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.changes.outputs.run_compat == 'true'
        with:
          repository: syntara-orchestration/syntara-step-types
          ref: ${{ env.STEP_TYPES_REF }}
          path: step-types
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.changes.outputs.run_compat == 'true'
        with:
          python-version: '3.12'
          version: '0.12.3'
      - name: Discover step types
        id: discover
        if: steps.changes.outputs.run_compat == 'true'
        run: python3 sdk/tests/step_types/discover.py step-types
      - name: Build candidate SDK wheels
        id: candidate-wheels
        if: steps.changes.outputs.run_compat == 'true'
        working-directory: sdk
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/candidate-wheels"
      - name: Check tooling tests
        id: tooling
        if: steps.changes.outputs.run_compat == 'true'
        continue-on-error: true
        working-directory: sdk
        run: |
          uv sync --locked --all-groups --no-build --no-install-workspace
          uv pip install --no-deps --no-build "$RUNNER_TEMP"/candidate-wheels/*.whl
          make test-step-types-helpers
      - name: Resolve the devel baseline
        id: baseline-run
        if: github.event_name == 'pull_request' && steps.changes.outputs.run_compat == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          run_id="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$BASE_SHA&status=completed&per_page=100" \
            | env -u GH_TOKEN python3 sdk/tests/step_types/select_baseline.py --base-sha "$BASE_SHA")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the devel baseline
        id: baseline-download
        if: github.event_name == 'pull_request' && steps.baseline-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          run-id: ${{ steps.baseline-run.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: step-types-compat-*
          path: baseline
          merge-multiple: true
      - name: Check the devel baseline
        id: baseline-check
        if: github.event_name == 'pull_request' && steps.changes.outputs.run_compat == 'true'
        continue-on-error: true
        env:
          PLUGINS: ${{ steps.discover.outputs.plugins }}
          DOWNLOADED: ${{ steps.baseline-download.outcome }}
        run: |
          available=false
          if [ "$DOWNLOADED" = success ] && python3 sdk/tests/step_types/run_grouped.py \
              --check-baseline baseline --plugins "$PLUGINS"; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: Check out the base SDK
        id: base-checkout
        if: github.event_name == 'pull_request' && steps.baseline-check.outputs.available != 'true' && steps.changes.outputs.run_compat == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.changes.outputs.base_sha }}
          path: baseline-sdk
          persist-credentials: false
      - name: Resolve the base step-types pin
        id: base-pin
        if: github.event_name == 'pull_request' && steps.baseline-check.outputs.available != 'true' && steps.changes.outputs.run_compat == 'true' && steps.base-checkout.outcome == 'success'
        continue-on-error: true
        run: |
          workflow=baseline-sdk/.github/workflows/ci.yml
          if ! grep -q '^  STEP_TYPES_REF: ' "$workflow"; then
            workflow=baseline-sdk/.github/workflows/step-types-compat.yml
          fi
          pin="$(sed -n "/^  STEP_TYPES_REF: /{s/.*'\([^']*\)'.*/\1/p;q;}" "$workflow")"
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Base pin unavailable::Cannot recompute the devel baseline.'
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out the base step types
        id: base-step-types
        if: github.event_name == 'pull_request' && steps.baseline-check.outputs.available != 'true' && steps.changes.outputs.run_compat == 'true' && steps.base-pin.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: syntara-orchestration/syntara-step-types
          ref: ${{ steps.base-pin.outputs.pin }}
          path: baseline-step-types
          persist-credentials: false
      - name: Recompute the devel baseline
        id: baseline-recompute
        if: github.event_name == 'pull_request' && steps.baseline-check.outputs.available != 'true' && steps.changes.outputs.run_compat == 'true' && steps.base-step-types.outcome == 'success'
        continue-on-error: true
        env:
          PLUGINS: ${{ steps.discover.outputs.plugins }}
        run: |
          rm -rf baseline
          mkdir -p baseline
          (cd baseline-sdk && uv build --all-packages --out-dir "$RUNNER_TEMP/baseline-wheels")
          python3 sdk/tests/step_types/run_grouped.py \
            --plugins "$PLUGINS" --driver baseline-sdk/tests/step_types/driver.py \
            --checkout baseline-step-types --wheels "$RUNNER_TEMP/baseline-wheels" \
            --reports baseline --mode enforcing
          python3 sdk/tests/step_types/run_grouped.py --check-baseline baseline --plugins "$PLUGINS"
      - name: Check the step types against the candidate SDK
        id: compat
        if: ${{ !cancelled() && steps.changes.outputs.run_compat == 'true' && steps.discover.outcome == 'success' && steps.candidate-wheels.outcome == 'success' }}
        env:
          PLUGINS: ${{ steps.discover.outputs.plugins }}
          DISPATCH_REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          mode=enforcing
          if [ "$DISPATCH_REPORT_ONLY" = true ]; then mode=report-only:dispatch; fi
          python3 sdk/tests/step_types/run_grouped.py \
            --plugins "$PLUGINS" --driver sdk/tests/step_types/driver.py \
            --checkout step-types --wheels "$RUNNER_TEMP/candidate-wheels" \
            --reports reports --mode "$mode"
      - name: Upload step-type reports
        id: upload
        if: ${{ !cancelled() && steps.changes.outputs.run_compat == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step-types-compat-grouped
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
      - name: Read the breaking-change label
        id: label
        if: ${{ !cancelled() && steps.changes.outputs.run_compat == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          present=false
          if [ "$EVENT_NAME" = pull_request ]; then
            labels="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')"
            if printf '%s\n' "$labels" | grep -qx breaking-change; then present=true; fi
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: compat-report
        if: ${{ !cancelled() }}
        env:
          PLUGINS: ${{ steps.discover.outputs.plugins }}
          CHANGES: ${{ steps.changes.outcome }}
          RUN_COMPAT: ${{ steps.changes.outputs.run_compat }}
          DISCOVER: ${{ steps.discover.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          COMPAT: ${{ steps.compat.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          LABEL_OUTCOME: ${{ steps.label.outcome }}
          LABEL_PRESENT: ${{ steps.label.outputs.present }}
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          BASE_RUN_ID: ${{ steps.baseline-run.outputs.run_id }}
          BASE_CHECK: ${{ steps.baseline-check.outcome }}
          BASE_AVAILABLE: ${{ steps.baseline-check.outputs.available }}
          BASE_RECOMPUTE: ${{ steps.baseline-recompute.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          source=not-attempted
          if [ "$BASE_AVAILABLE" = true ]; then source=devel-run; fi
          if [ "$BASE_RECOMPUTE" = success ]; then source=recomputed; fi
          if { [ "$BASE_AVAILABLE" = false ] || [ "$BASE_CHECK" = failure ]; } && [ "$BASE_RECOMPUTE" != success ]; then source=failed; fi
          if [ "$source" = failed ] || [ "$source" = not-attempted ]; then rm -rf baseline; fi
          mkdir -p baseline
          BASE_SOURCE="$source" python3 -c 'import json, os; from pathlib import Path; Path("baseline/meta.json").write_text(json.dumps({"base_sha": os.environ["BASE_SHA"], "run_id": os.environ["BASE_RUN_ID"], "source": os.environ["BASE_SOURCE"]}))'
          if [ "$RUN_COMPAT" = true ] && { [ "$UPLOAD" != success ] || [ "$LABEL_OUTCOME" != success ]; }; then COMPAT=failure; fi
          python3 sdk/tests/step_types/report.py --reports-dir reports --baseline-dir baseline \
            --event "$EVENT_NAME" --plugins "${PLUGINS:-[]}" --changes "$CHANGES" \
            --run-compat "$RUN_COMPAT" --discover "$DISCOVER" --tooling "$TOOLING" \
            --compat "$COMPAT" --label-report-only "${LABEL_PRESENT:-false}"
