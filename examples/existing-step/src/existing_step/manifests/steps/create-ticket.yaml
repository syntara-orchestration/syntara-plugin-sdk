{
  "apiVersion": "syntara.io/v1alpha1",
  "kind": "Action",
  "metadata": {
    "name": "create-ticket",
    "displayName": "Create ticket",
    "description": "Creates one deterministic ticket identifier."
  },
  "spec": {
    "runtime": {
      "kind": "custom-runner",
      "entryPoint": "existing_step.runtime:CreateTicketStep"
    },
    "input": {
      "kind": "inline",
      "value": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "title": {
            "type": "string"
          }
        },
        "required": ["title"]
      }
    },
    "output": {
      "kind": "inline",
      "value": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "ticket_id": {
            "type": "string"
          }
        },
        "required": ["ticket_id"]
      }
    }
  }
}
