name: GitHub Actions security

on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches: [devel]
    paths:
      - .github/workflows/**

permissions: {}

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
