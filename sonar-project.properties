# Project identity comes from the SonarCloud ALM binding to this repository;
# the bound project's key predates the repo rename and is due an org-admin
# rename on the SonarCloud side.

# Generated protobuf/gRPC bindings are regenerated by
# `make generate-container-protocol` and are never hand-edited.
sonar.exclusions=**/protocol/**,**/*_pb2*.py
