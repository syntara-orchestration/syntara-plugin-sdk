{
  "apiVersion": "syntara.io/v1alpha1",
  "kind": "Action",
  "metadata": {
    "name": "script-python",
    "displayName": "Python Script (compat)",
    "description": "Runs Python code in a subprocess and proves credential delivery."
  },
  "spec": {
    "runtime": {
      "kind": "custom-runner",
      "entryPoint": "credential_steps.runtime:ScriptPythonStep"
    },
    "integrationType": "compat.credentials.connection",
    "input": {
      "kind": "inline",
      "value": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code"],
        "properties": {
          "code": {
            "type": "string",
            "minLength": 1,
            "description": "Python source code to execute."
          },
          "environment": {
            "type": "object",
            "additionalProperties": {"type": "string"},
            "description": "Environment variables passed to the Python process."
          },
          "timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 600,
            "default": 60,
            "description": "Deadline for the subprocess, enforced by the worker."
          }
        }
      }
    },
    "output": {
      "kind": "inline",
      "value": {
        "type": "object",
        "additionalProperties": false,
        "required": ["return_code", "stdout", "stderr"],
        "properties": {
          "return_code": {"type": "integer", "description": "Process exit code."},
          "stdout": {"type": "string", "description": "Captured standard output."},
          "stderr": {"type": "string", "description": "Captured standard error."},
          "stdout_json": {
            "description": "Parsed JSON from the final non-empty line of stdout, when valid."
          }
        }
      }
    },
    "error": {
      "kind": "inline",
      "value": {"type": "object", "additionalProperties": true}
    }
  }
}
