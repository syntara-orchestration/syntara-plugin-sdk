syntax = "proto3";

package syntara.container.v1alpha1;

// ABI means Application Binary Interface. Here it is the versioned, language-
// neutral gRPC protocol between the Execution Plane (the client/launcher) and
// a publisher-owned plugin workload (the server), not an OCI image's CPU or
// operating-system compatibility. A workload in any language may participate
// if it implements this service and the message semantics below.
//
// Health checks the ABI and step revision before Execute. This bidirectional
// Execute replaces the earlier unary-request protocol under the same ABI
// identifier; Health alone cannot distinguish them. Both peers must implement
// this contract. The transport must authenticate both peers and protect
// confidentiality (mTLS in production).
service ContainerService {
  rpc Execute(stream ExecuteClientMessage) returns (stream ExecuteServerMessage);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  string invocation_id = 1;
  string workflow_run_id = 8;
  string step_revision_id = 2;
  string runtime_abi = 3;
  bytes inputs_json = 4;
  reserved 5;
  reserved "credential_file_paths_json";
  uint32 timeout_seconds = 6;
  // A bounded, non-secret runner-specific context selected by Syntara from the
  // installed immutable step. It never contains an endpoint or credential.
  bytes runtime_context_json = 7;
}

// The first client message is start; subsequent messages are responses to
// credential requests. Each request ID is unique within an invocation. A
// client may close its send stream; the invocation continues, but pending and
// future credential reads fail. Any other subsequent message processed before
// the terminal event is committed cancels the invocation with a terminal
// CANCELLED failure. Messages arriving after that point may be ignored.
message ExecuteClientMessage {
  oneof message {
    ExecuteRequest start = 1;
    CredentialResponse credential_response = 2;
  }
}

message ExecuteServerMessage {
  oneof message {
    ExecutionEvent event = 1;
    CredentialRequest credential_request = 2;
  }
}

// name is a declared CredentialRecipe ID, not a credential ID or reference.
message CredentialRequest {
  string invocation_id = 1;
  string request_id = 2;
  string name = 3;
}

// This sensitive response is never an ExecutionEvent. Exactly one of document
// or error must be set. The document is a JSON object of at most 1 MiB;
// error has no provider-specific message or details.
message CredentialResponse {
  string invocation_id = 1;
  string request_id = 2;
  oneof outcome {
    bytes document_json = 3;
    CredentialError error = 4;
  }
}

enum CredentialError {
  CREDENTIAL_ERROR_UNSPECIFIED = 0;
  CREDENTIAL_ERROR_MISSING = 1;
  CREDENTIAL_ERROR_UNAVAILABLE = 2;
}

message Progress {
  uint32 sequence = 1;
  string state = 2;
  string message = 3;
  double percent = 4;
  bool has_percent = 5;
}

// The terminal SDK output envelope. A completed step with a nonzero
// status_code remains a valid SDK outcome; the separate Failure event is
// reserved for protocol or runtime failures where no valid outcome exists.
message Result {
  // Trusted digest of the step type's declared output schema. It is applied
  // to the successful business result below, never to this envelope itself.
  string output_schema_digest = 1;
  // Canonical JSON of the SDK wrapper's Result field (the business output).
  bytes output_json = 2;
  // Object-store reference to the serialized business result when it exceeds
  // the inline JSON bound. A successful result carries exactly one of
  // output_json/object_reference; a deliberate step type failure may omit both.
  string object_reference = 3;
  // The SDK wrapper's StatusCode: 0 is success and any nonzero value is a
  // deliberate step type failure that remains a valid terminal outcome.
  uint32 status_code = 4;
  // Safe, bounded wrapper StatusMessage.
  string status_message = 5;
  // Former flattened error fields must not be reused.
  reserved 6, 7, 8, 9;
  reserved "error_code", "error_message", "retryable", "error_category";
  // Canonical JSON of the complete structured ErrorResult; empty on success.
  bytes error_result_json = 10;
  // Canonical digest of the effective schema applied to the error result.
  string error_schema_digest = 11;
}

// Emitted only when no valid SDK outcome can be produced, for example an ABI
// violation or an unexpected runtime failure. A completed step with a nonzero
// StatusCode is carried by Result instead.
message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string outcome = 4;
  string correlation_id = 5;
  string provider_code = 6;
}

message ExecutionEvent {
  string invocation_id = 1;
  oneof event {
    Progress progress = 2;
    Result result = 3;
    Failure failure = 4;
  }
}

message CancelRequest { string invocation_id = 1; }
message CancelResponse { bool accepted = 1; }
message HealthRequest {}
message HealthResponse {
  bool ready = 1;
  string runtime_abi = 2;
  repeated string step_revision_ids = 3;
}
